services:
  - type: web
    name: signalai-agent
    runtime: python
    plan: starter
    buildCommand: pip install .
    startCommand: uvicorn signalai_agent.app:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: SIGNALAI_CAPABILITY_BASE_URL
        sync: false
      - key: SIGNALAI_SERVICE_TOKEN
        sync: false
      - key: SIGNALAI_LLM_BASE_URL
        sync: false
      - key: SIGNALAI_LLM_API_KEY
        sync: false
      - key: SIGNALAI_LLM_MODEL
        sync: false
      - key: SIGNALAI_LLM_TIMEOUT_SECONDS
        value: "60"
      - key: SIGNALAI_MAX_STEPS
        value: "8"
